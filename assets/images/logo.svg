<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Rescue Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Borders -->
  <circle cx="512" cy="512" r="496" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="472" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="16 8"/>
  <circle cx="512" cy="512" r="454" fill="none" stroke="#dc2626" stroke-width="6"/>

  <!-- Decorative Stars on Ring -->
  <text x="75" y="525" fill="url(#goldGrad)" font-size="36" font-family="Arial, sans-serif" text-anchor="middle">★</text>
  <text x="949" y="525" fill="url(#goldGrad)" font-size="36" font-family="Arial, sans-serif" text-anchor="middle">★</text>

  <!-- Upper Arc / Arabic Name: أوناش إنقاذ أولاد حجازي -->
  <g filter="url(#shadow)">
    <text x="512" y="210" fill="#ffffff" font-size="68" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">
      أوناش إنقاذ أولاد حجازي
    </text>
    <text x="512" y="260" fill="url(#goldGrad)" font-size="28" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="3">
      الأسطول الهيدروليكي المعتمد الأول بمصر
    </text>
  </g>

  <!-- Center Graphic: Modern Flatbed Tow Truck -->
  <g transform="translate(380, 290) scale(0.9)" filter="url(#shadow)">
    <!-- Truck Cabin (Rescue Red) -->
    <path d="M 0 90 L 0 20 L 50 -10 L 100 -10 L 100 90 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Cabin Window -->
    <path d="M 15 15 L 45 -2 L 85 -2 L 85 25 L 15 25 Z" fill="#94a3b8" opacity="0.9"/>
    <!-- Emergency Flashing Beacon -->
    <ellipse cx="65" cy="-20" rx="18" ry="8" fill="#ffffff" filter="url(#glowGold)"/>
    <ellipse cx="65" cy="-20" rx="14" ry="6" fill="#ef4444"/>
    
    <!-- Flatbed Ramp (Silver Chrome) -->
    <rect x="100" y="60" width="200" height="25" rx="4" fill="url(#silverGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Hydraulic Boom Crane & Cable -->
    <line x1="140" y1="60" x2="220" y2="-10" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <line x1="220" y1="-10" x2="250" y2="25" stroke="#f8fafc" stroke-width="4"/>
    <!-- Heavy Duty Hook -->
    <path d="M 245 25 C 245 40 265 40 265 25 C 265 15 255 15 255 25" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Truck Wheels -->
    <circle cx="30" cy="95" r="24" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="30" cy="95" r="10" fill="url(#silverGrad)"/>
    <circle cx="210" cy="95" r="24" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="210" cy="95" r="10" fill="url(#silverGrad)"/>
    <circle cx="260" cy="95" r="24" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="260" cy="95" r="10" fill="url(#silverGrad)"/>
  </g>

  <!-- Central Brand Banner: AWLAD HEGAZY -->
  <g transform="translate(0, 512)" filter="url(#shadow)">
    <!-- Red Accent Background -->
    <rect x="60" y="-60" width="904" height="120" rx="20" fill="url(#redGrad)"/>
    <!-- Gold Border Inner -->
    <rect x="70" y="-52" width="884" height="104" rx="16" fill="url(#goldGrad)"/>
    <!-- Dark Inner Plaque -->
    <rect x="76" y="-46" width="872" height="92" rx="12" fill="#090d16"/>

    <!-- Brand Name AWLAD HEGAZY in Gold -->
    <text x="512" y="24" fill="url(#goldGrad)" font-size="74" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="8" filter="url(#glowGold)">
      AWLAD HEGAZY
    </text>
    <text x="512" y="-18" fill="#f8fafc" font-size="20" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="6">
      ★ TOWING &amp; RESCUE SERVICE 24/7 ★
    </text>
  </g>

  <!-- Lower Section: Location & Emergency Hotline -->
  <g filter="url(#shadow)">
    <text x="512" y="695" fill="url(#goldGrad)" font-size="34" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="2">
      كارفور العبور • القاهرة الكبرى • أسرع وصول 10 دقائق
    </text>

    <!-- Emergency Hotline Badge -->
    <rect x="250" y="740" width="524" height="84" rx="42" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
    <text x="512" y="798" fill="#ffffff" font-size="44" font-family="'Cairo', Arial, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">
      طوارئ 24 ساعة: 01032194206
    </text>

    <!-- Trust Quality Shield at Bottom -->
    <path d="M 512 855 L 545 885 C 545 925 512 945 512 945 C 512 945 479 925 479 885 Z" fill="url(#goldGrad)" stroke="#090d16" stroke-width="3"/>
    <text x="512" y="910" fill="#090d16" font-size="28" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">✓</text>
  </g>
</svg>
